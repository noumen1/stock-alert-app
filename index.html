<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Stock Alert System</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="layout-wrapper">
        
        <aside class="sidebar">
            <div class="sidebar-header">
                <h2>🔔 Alert Lists</h2>
            </div>

            <div class="sidebar-header">
                <h2>🔔 Alert Lists</h2>
                <!-- ADD THIS BUTTON -->
                <button id="generate-altucher-btn" style="margin-top:15px; width:100%; padding:10px; background:var(--accent-color); color:white; border:none; border-radius:4px; cursor:pointer; font-weight:bold;">
                    ⚡ Gen Altucher 9.5%
                </button>
            </div>
            
            <div id="group-list" class="group-list">
                </div>

            <div class="add-group-container">
                <input type="text" id="new-group-name" placeholder="New List Name">
                <button id="add-group-btn">+</button>
            </div>
        </aside>

        <main class="main-content">
            <div class="app-container">
                
                <h1 id="header-title">Watchlist</h1>

                <div id="list-container" class="list-container">
                    <div class="list-view-header">
                        <span class="col-ticker">Ticker</span>
                        <span class="col-alert">Alert Rule</span>
                        <span class="col-desc">Thesis / Notes</span>
                        <span class="col-actions">Actions</span>
                    </div>
                    <div id="list-view-content" class="list-view-content">
                        </div>
                </div>

                <div class="form-container">
                    <h3 id="form-title">Add New Alert</h3>
                    
                    <div class="form-row">
                        <div class="input-group small">
                            <label>Ticker</label>
                            <input type="text" id="input-ticker" placeholder="e.g. AAPL" maxlength="10">
                        </div>

                        <div class="input-group medium">
                            <label>Target Price ($)</label>
                            <input type="number" id="input-price" placeholder="150.00" step="0.01">
                        </div>

                        <div class="input-group medium">
                            <label>Trigger When</label>
                            <select id="input-condition">
                                <option value="above">Price goes ABOVE ▲</option>
                                <option value="below">Price goes BELOW ▼</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-row">
                        <div class="input-group full">
                            <label>Thesis / Note</label>
                            <textarea id="input-description" placeholder="Why are we watching this?" rows="3"></textarea>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button id="save-btn" class="save-btn">Add Alert</button>
                        <button id="cancel-edit-btn" class="cancel-btn hidden">Cancel</button>
                    </div>
                </div>

            </div>
        </main>
    </div>

    <script src="script.js"></script>
</body>
</html>
